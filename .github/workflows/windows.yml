# Baut den Windows-Installer automatisch (GitHub Actions). Ergebnis unter "Artifacts".
name: Windows-Installer
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt
      - name: Tests (plattformneutrale Teile)
        run: |
          python tests/test_layout.py
          python tests/test_proof.py
          python tests/test_repair.py
      - name: Build (inkl. gebuendeltem Ghostscript)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File windows\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Passermark-Windows
          path: dist/Passermark-*-Setup.exe
