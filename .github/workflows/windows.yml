# SPDX-License-Identifier: GPL-3.0-or-later
# Builds the Windows installer (Setup.exe incl. Ghostscript). Result: "Artifacts" of the run. Pushing a tag v*
# builds by itself and attaches Setup.exe and its .sha256 to the GitHub Release (needed by the update function).
# Start by hand: Actions -> Windows installer -> Run workflow (choose the tag to attach to an existing release).
name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "\tmp" | Out-Null
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt numpy reportlab
          python tests/test_layout.py
          python tests/test_l10n.py
          python tests/test_win_print.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: rsvg-convert from MSYS2 (SVG as vectors; optional)
        shell: pwsh
        continue-on-error: true
        run: C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-librsvg"
      - name: Build installer
        shell: pwsh
        run: ./windows/build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: Passermark-Windows
          path: dist/Passermark-*-Setup.exe
          if-no-files-found: error
      - name: Checksum for the update function (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Get-ChildItem dist/Passermark-*-Setup.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -Encoding ascii -NoNewline "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-windows
          path: |
            dist/Passermark-*-Setup.exe
            dist/Passermark-*-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 3

  # Attach to the release; same concurrency group as in linux.yml (never two releases for one tag).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: release-windows
          path: dist
      - name: Release notes from the changelogs
        run: python3 tools/release_notes.py "$GITHUB_REF_NAME" > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
