# SPDX-License-Identifier: GPL-3.0-or-later
# Builds the Linux AppImage (incl. Python, Qt, Ghostscript). Built on ubuntu-22.04 so it runs on newer distros too.
# Result: "Artifacts" of the run. Pushing a tag v* builds by itself and attaches AppImage, source package and
# their .sha256 to the GitHub Release – the update function of the program needs exactly these files.
name: Linux AppImage
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-cups python3-dev ghostscript libcups2-dev patchelf wget file \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxkbcommon-x11-0 libegl1 libgl1 fonts-liberation2 fonts-crosextra-carlito \
            fonts-crosextra-caladea fonts-dejavu-core fontconfig
      - name: Build AppImage
        run: ./linux/build-appimage.sh
      - name: Code style
        run: |
          .venv/bin/pip install ruff
          .venv/bin/ruff format --check .
          .venv/bin/ruff check .
      - name: Tests
        run: |
          .venv/bin/pip install reportlab numpy
          # for testing only (after AppImage build, not shipped in the package): actually read the generated QR/EAN codes
          .venv/bin/pip install opencv-python-headless || echo "OpenCV nicht installierbar – Lese-Tests übersprungen"
          .venv/bin/python tests/test_layout.py
          .venv/bin/python tests/test_l10n.py
          .venv/bin/python tests/test_win_print.py
          .venv/bin/python tests/test_gui_smoke.py
          .venv/bin/python tests/test_cut_dialog.py
          .venv/bin/python tests/test_measure.py
          .venv/bin/python tests/test_measure_gui.py
          .venv/bin/python tests/test_core.py
          .venv/bin/python tests/test_cli.py
          .venv/bin/python tests/test_cli_howto.py
          .venv/bin/python tests/test_jobproc.py
          .venv/bin/python tests/test_jobs_gui.py
          .venv/bin/python tests/test_parallel.py
          .venv/bin/python tests/test_crashlog.py
          .venv/bin/python tests/test_presets.py
          .venv/bin/python tests/test_binding.py
          .venv/bin/python tests/test_vdp.py
          .venv/bin/python tests/test_datakinds.py
          .venv/bin/python tests/test_examples.py
          .venv/bin/python tests/test_split.py
          .venv/bin/python tests/test_performance.py
          .venv/bin/python tests/test_updates.py
          .venv/bin/python tests/test_release_notes.py
      - name: Self test of the AppImage (all bundled dependencies)
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen timeout 120 dist/*.AppImage --selftest
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 60 dist/*.AppImage --cli list
      - uses: actions/upload-artifact@v7
        with:
          name: Passermark-Linux-AppImage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 3
      - name: Source package and checksums for the update function (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="passermark-$VER/" -o "dist/passermark-src-$VER.tar.gz" HEAD
          cd dist
          for f in *.AppImage passermark-src-*.tar.gz; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-linux
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
            dist/passermark-src-*.tar.gz
            dist/passermark-src-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3

  # Attach to the release. Own job with the same concurrency group as in windows.yml: the two workflows never
  # create the release at the same time (that could give two releases for one tag).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: release-linux
          path: dist
      - name: Release notes from the changelogs
        run: python3 tools/release_notes.py "$GITHUB_REF_NAME" > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          # a tag with a suffix (v1.19.7-test1) is a pre-release: only the test channel of the program sees it
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
