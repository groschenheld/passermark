# SPDX-License-Identifier: GPL-3.0-or-later
# Builds the Linux AppImage (incl. Python, Qt, Ghostscript). Built on ubuntu-22.04 so it runs on newer distros too.
# Result: "Artifacts" of the run; for tags v* also attached to a GitHub Release.
name: Linux AppImage
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-cups python3-dev ghostscript libcups2-dev patchelf wget file \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxkbcommon-x11-0 libegl1 libgl1 fonts-liberation2 fonts-crosextra-carlito \
            fonts-crosextra-caladea fonts-dejavu-core fontconfig
      - name: Build AppImage
        run: ./linux/build-appimage.sh
      - name: Tests
        run: |
          .venv/bin/pip install reportlab numpy
          .venv/bin/python tests/test_layout.py
          .venv/bin/python tests/test_l10n.py
          .venv/bin/python tests/test_win_print.py
          .venv/bin/python tests/test_gui_smoke.py
          .venv/bin/python tests/test_cut_dialog.py
          .venv/bin/python tests/test_measure.py
          .venv/bin/python tests/test_measure_gui.py
          .venv/bin/python tests/test_core.py
          .venv/bin/python tests/test_cli.py
          .venv/bin/python tests/test_cli_howto.py
          .venv/bin/python tests/test_jobproc.py
          .venv/bin/python tests/test_jobs_gui.py
          .venv/bin/python tests/test_parallel.py
      - name: Self test of the AppImage (all bundled dependencies)
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen timeout 120 dist/*.AppImage --selftest
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 60 dist/*.AppImage --cli list
      - uses: actions/upload-artifact@v7
        with:
          name: Passermark-Linux-AppImage
          path: dist/*.AppImage
          if-no-files-found: error
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
